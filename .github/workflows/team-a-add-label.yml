name: Add 'team-a' label!!

on:
  pull_request:
    types: [opened,synchronize]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  pull-requests: write

jobs:
  name: "Add 'team-a' label when source branch name contains team-a"
  add-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add team-a label
        if: contains(github.head_ref, 'team-a')
        run: gh pr edit ${{ github.event.pull_request.number }} --add-label team-a

      - name: "echo something"
        run: echo "If you see this, it means the workflow is using the code from the source branch"