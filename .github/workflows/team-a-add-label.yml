name: Add team-a label

on:
  pull_request:
    types: [opened]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  pull-requests: write

jobs:
  add-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add team-a label if source branch name contains team-a
        if: contains(github.head_ref, 'team-a')
        run: gh pr edit ${{ github.event.pull_request.number }} --add-label team-a