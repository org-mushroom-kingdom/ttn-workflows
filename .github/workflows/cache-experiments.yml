# Say I have a Github Actions workflow job that functions as a status check. 
# This workflow is fired whenever a pull request is opened or synchronized. 
# The workflow will use Python to look at all comments in the HTML, then filter those comments out into an array based on
#  if the comment has the text "TODO" in it. Comments with the text "TODO" in them can be referred to as "'TODO' comments'. 

# A script in the workflow will look at each "TODO" comment and check via pattern matching for a string like "TTNF-1234". 

name: Cache Experiments

on:
  
    workflow_dispatch:
        inputs:
            use-cache:
                description: "Use the cache"
                required: true
                type: boolean
                default: false
            use-dummy-html:
                description: "Take HTML file from testing/html-checks/html"
                required: true
                type: boolean
                default: true
            verbose:
                description: "Adds more debug statements"
                type: boolean
                required: false
                default: false


    workflow_call:
        inputs:
            use-cache:
                description: "Use the cache"
                required: true
                type: boolean
                default: false
            verbose:
                description: "Adds more debug statements"
                type: boolean
                required: false
                default: false

# Do something like Github CLI command to get array of changed filenames from PR
# First check if there's any .html files in the array. If there isn't exit early with success
# To really do that though maybe have two jobs: "html-exists", "cache-experiment-job"
#  cache-experiment-job --> if html-exists.outputs.there-are-html-files == "true"
env:
    GH_TOKEN: ${{ secrets.github_token }}

jobs:

    html-exists:
        name: "Check for HTML files"
        runs-on: ubuntu-latest
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
            EVENT_NAME: ${{ github.event_name }}
        outputs: 
            # General format steps.<step-id>.outputs.<var written to GITHUB_OUTPUT>
            html-files-present: ${{ steps.check-for-html-files.outputs.html-files-present }}
            html-filenames: ${{ steps.check-for-html-files.outputs.html-filenames }}

        steps:

            - name: "Checkout repo"
              uses: actions/checkout@v4

            - name: "Manual trigger: Use dummy HTML files from a ttn-workflows PR"
              if: inputs.use-dummy-html == true
              run: |
                echo "Setting PR_NUMBER to 9 (has 2 .html files)"
                echo "PR_NUMBER=9" >> $GITHUB_ENV

            - name: "Give exec permissions to scripts"
              run: chmod a+x ./scripts/html-checks/*.sh ./scripts/html-checks/*.py

            # TODO change this to a script. Arg: PR_NUM, inputs.verbose, github.event_name
            - name: "Assess PR Changed Files for *.html"
              id: check-for-html-files
              run: |
                bash ./scripts/html-checks/check-for-html-files.sh $PR_NUMBER ${{ inputs.verbose }} ${{ github.event_name }}

    cache-experiment-job:
        name: "HTML Checks (example of cache usage)"
        runs-on: ubuntu-latest
        needs: html-exists
        env:
            WORKFLOW_FILENAME: ""
        if: needs.html-exists.outputs.html-files-present == 'true'
        steps:
            
            - name: "Checkout repo"
              uses: actions/checkout@v4

            - name: "Echo vars"
              run: |
                echo "output!html-exists = ${{ needs.html-exists.outputs.html-filenames }}"
                echo "output!html-files-present = ${{ needs.html-exists.outputs.html-files-present }}"

            # actions/setup-python makes a virtual environment for you and it's already active, so usually no need to do things like "python m venv .venv" or "source .venv/bin/activate"
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: "3.11"

            - name: Set WORKFLOW_FILENAME
              run: |
                
                workflow_full_path="${{ github.workflow_ref }}"
                # echo "workflow_full_path = ${workflow_full_path}"
                workflow_filename=${workflow_full_path#*".github/workflows/"}
                if [[ "$workflow_filename" == *"@"* ]]; then
                    workflow_filename=${workflow_filename%@*}
                fi
                # echo "workflow_filename = ${workflow_filename}"
                echo "WORKFLOW_FILENAME=${workflow_filename}" >> $GITHUB_ENV

            # Github-hosted runners (exclusively used by ttn-workflows) start in a clean environment every time, meaning dependencies must be redownloaded
            # Caches speed up workflows by having saved versions of downloaded dependencies (such as Python modules) in Github cloud storage.
            # Caches persist for 7 days. They are stored on Github servers, 
            # Caches have specific metadata to specify the repository the workflow resides on and the cache version (a hash made based the compression tool and path) 
            - name: "Use actions/cache to speed up dependency installation"
              id: cache-dependencies
              if: inputs.use-cache
              uses: actions/cache@v4
              with: 
                #  ~/.cache/pip is where TODO WHEELS
                path: ~/.cache/pip
                # actions/cache uses a key to save the cache. A key is a unique string to identify the cache. Caches are saved and restored from the same key. 
                # actions/cache will look for the cache key: it first looks for an exact match. An exact match is considered a cache hit (anything else is considered a cache miss). 
                # If no exact matches--> looks for partial matches. This counts as a cache miss. 
                # If no partial match found, will try to restore using restore-keys (if using. We're not using them here.) This also counts as a cache miss.
                # restore-keys is a list of TODO
                # If restore-keys is used: 
                #   Exact match --> files of restore-keys match used restored to path:
                #   Partial match --> Most recent cache restored to path: 
                # Cache hit --> files of cache restored to path:. | Cache miss --> new cache made if job is OK, try to use restore-keys for current job (see above)
                key: ${{ runner.os }}-${{ env.WORKFLOW_FILENAME }}
                # You can fail the workflow in the event of a cache miss (this is false by default)
                fail-on-cache-miss: false

            # The steps.<step-id>.outputs-cache-hit output shows if there was a cache hit or miss. This info can be useful to conditionally fire off other steps 
            - name: "Show cache-hit value"
              if: inputs.use-cache
              run: echo "${{ steps.cache-dependencies.outputs.cache-hit }}"  

            # The time duration of this step (~20 seconds) should decrease drastically when using a cache
            - name: Install dependencies
              run: pip install -r ./scripts/html-checks/requirements.txt

            - name: "Script: Check each HTML file's TODOs have corresponding story"
              run: |
                echo "blablbala"
                # You could either feed whole  ".html,.html,..."string in or do a loop here and subject each to script
                # python html-checks/main.py